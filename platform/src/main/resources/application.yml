server:
  port: 8888
spring:
  profiles:
    active: dev # 环境 dev|test|prod
  application:
    name: yeying-social-platform
  flyway:
    enabled: true
    baseline-on-migrate: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  global-config:
    db-config:
      id-type: AUTO # ID自增
  configuration:
    map-underscore-to-camel-case: true  #开启自动驼峰命名规则
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  accessToken:
    expireIn: 1800 #半个小时
    secret: MIIBIjANBgkq
  refreshToken:
    expireIn: 604800 #7天
    secret: IKDiqVmn0VFU

ai:
  enabled: false
  chat-completions-url:
  api-key:
  model: gpt-4o-mini
  timeout-ms: 10000
  max-context-messages: 20

passport:
  # Node Passport is the only authority for Wallet and Passkey authentication.
  node-base-url: ${PASSPORT_NODE_BASE_URL:}
  app-id: ${PASSPORT_APP_ID:}
  callback-url: ${PASSPORT_CALLBACK_URL:}
  scopes: identity.basic,identity.email,identity.wallet
  session-ttl-seconds: 300
